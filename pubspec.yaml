name: week12_starter
description: "IGME-340 Weeks 12-13: Flame overlays, Provider and audio"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Everything for 12A, 12B and 13A, already installed. webview_flutter and
  # flame_audio include Android code, so adding them in the middle of class
  # would mean stopping and rebuilding the app.
  flame: ">=1.23.0 <2.0.0"
  flame_audio: ">=2.10.7 <3.0.0"
  provider: ">=6.1.0 <7.0.0"
  webview_flutter: ">=4.9.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  # The trailing slashes load every file in each folder.
  assets:
    - assets/images/
    - assets/audio/
